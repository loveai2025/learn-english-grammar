{{ define "signup.html" }}
{{ template "header" . }}
<div class="min-h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">注册新账户</h2>
        <p class="mt-2 text-center text-sm text-gray-600">
            已有账户？
            <a href="/login" class="font-medium text-indigo-600 hover:text-indigo-500"> 立即登录 </a>
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
            <form class="space-y-6" id="signup-form">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700"> 邮箱地址 </label>
                    <div class="mt-1">
                        <input id="email" name="email" type="email" autocomplete="email" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700"> 密码 </label>
                    <div class="mt-1">
                        <input id="password" name="password" type="password" autocomplete="new-password" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                    </div>
                </div>

                <div>
                    <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        注册
                    </button>
                </div>
            </form>
            <div id="message" class="mt-4 text-sm text-center hidden"></div>
        </div>
    </div>
</div>

<script>
    const signupForm = document.getElementById('signup-form');
    const message = document.getElementById('message');

    signupForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (!supabase) {
            message.textContent = "Supabase client not initialized. Please check configuration.";
            message.classList.remove('hidden');
            message.classList.add('text-red-600');
            return;
        }

        const { data, error } = await supabase.auth.signUp({
            email: email,
            password: password,
        });

        if (error) {
            message.textContent = error.message;
            message.classList.remove('hidden');
            message.classList.add('text-red-600');
            message.classList.remove('text-green-600');
        } else {
            message.textContent = "注册成功！请检查您的邮箱以确认账号。";
            message.classList.remove('hidden');
            message.classList.add('text-green-600');
            message.classList.remove('text-red-600');
        }
    });
</script>
{{ template "footer" . }}
{{ end }}
